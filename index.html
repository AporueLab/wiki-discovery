<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0e0c">
  <meta name="description" content="Explore a curated collection of Wikipedia articles with Wiki Discovery.">
  <title>Wiki Discovery</title>
  <link rel="icon" href="https://lh3.googleusercontent.com/u/0/d/1jGcEi8QAeG2i_xy9M0n6AURJbsKy9QLn">
  <style>
    :root {
      color-scheme: dark;
      --page-background: #0a0e0c;
      --page-margin: 6px;
    }

    * { box-sizing: border-box; }

    html {
      height: 100%;
      background: var(--page-background);
    }

    body {
      height: 100vh;
      height: 100dvh;
      margin: 0;
      padding: var(--page-margin);
      padding-top: max(var(--page-margin), env(safe-area-inset-top, 0px));
      padding-right: max(var(--page-margin), env(safe-area-inset-right, 0px));
      padding-bottom: max(var(--page-margin), env(safe-area-inset-bottom, 0px));
      padding-left: max(var(--page-margin), env(safe-area-inset-left, 0px));
      overflow: hidden;
      background: var(--page-background);
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--page-background);
    }

    iframe:focus-visible {
      outline: 2px solid #83d0ae;
      outline-offset: -2px;
    }
  </style>
</head>
<body>
  <!-- To embed a different deployment, replace only the URL in src below.
       Keep the /exec URL. The app scrolls inside this full-height frame. -->
  <iframe
    title="Wiki Discovery article explorer"
    src="https://script.google.com/macros/s/AKfycbwBZzaz-WA06WU5YA3GkjlbguRpo-SiOIHsy3VM4L2z3Qsd0yVIuhN6aSIOKoZDmfS2aw/exec"
  ></iframe>
</body>
</html>
